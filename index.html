<body class="bg-stone-900 text-stone-300 font-sans antialiased flex flex-col min-h-screen">

    <nav class="bg-stone-950/80 backdrop-blur-md sticky top-0 z-50 border-b border-stone-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-serif text-white tracking-widest">STOLMAR</a>
            <div class="hidden md:flex space-x-6 text-sm uppercase tracking-wider">
                <a href="index.html" class="text-amber-500 transition">Home</a>
                <a href="o-firmie.html" class="hover:text-amber-500 transition">O firmie</a>
                <a href="oferta.html" class="hover:text-amber-500 transition">Oferta</a>

                <a href="kontakt.html" class="hover:text-amber-500">Kontakt</a>
            </div>
        </div>

    <!-- Zaktualizowana sekcja Hero -->
    <!-- Nowa sekcja Hero z efektem Glassmorphism -->
    <main class="flex-grow flex items-center justify-center relative py-32 px-4 text-center">
        <!-- Zdjęcie na 100% widoczności, bez ciemnej nakładki na całości -->
        <div class="absolute inset-0 bg-[url('z1.avif')] bg-cover bg-center"></div>
        
        <!-- Bardzo delikatny, ciemny gradient tylko przy krawędziach (pod menu i nad stopką) -->
        <div class="absolute inset-0 bg-gradient-to-b from-stone-950/60 via-transparent to-stone-950/80"></div>
        
        <!-- Panel "oszronionego szkła" pod samym tekstem -->
        <div class="relative z-10 max-w-3xl bg-stone-950/50 backdrop-blur-md border border-stone-600/30 p-8 md:p-12 rounded-xl shadow-2xl">
            <h1 class="text-5xl md:text-7xl font-serif text-white mb-6 drop-shadow-lg">Sztuka Drewna</h1>
            <p class="text-lg md:text-xl text-stone-200 mb-10 drop-shadow-md font-medium leading-relaxed">Schody mogą być rzeźbą, meblem albo czystą funkcją. Od 1987 roku tworzymy formy, które harmonijnie wtapiają się we wnętrze.</p>
            <a href="kontakt.html" class="inline-block bg-amber-600 hover:bg-amber-500 text-white px-8 py-3 rounded-sm uppercase tracking-wider transition shadow-lg">Darmowa wycena</a>
        </div>
    </main>
    <footer class="bg-stone-950 py-8 text-center text-stone-500 text-sm border-t border-stone-800 relative z-10">
        <p>&copy; 2026 STOLMAR Mariusz Nowotyński. Nowoczesna realizacja.</p>
